[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["puffco_py*"]
exclude = ["site*", "tests*", "examples*", "build*"]

[tool.setuptools.package-data]
puffco_py = ["py.typed"]


[project]
name = "puffco-py"
version = "0.1.1"
description = "Modern, standalone Python BLE client and telemetry engine for Puffco Peak Pro and Proxy devices."
readme = "README.md"
authors = [
    { name = "Sam S." }
]
license = { text = "MIT" }
keywords = ["puffco", "peak", "proxy", "bluetooth", "ble", "lorax", "iot", "reverse-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
requires-python = ">=3.9"
dependencies = [
    "bleak>=0.21.0",
]

[project.optional-dependencies]
cli = [
    "rich>=13.0.0",
]
gui = [
    "rumps>=0.4.0; platform_system=='Darwin'",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
]

[project.scripts]
puffco = "puffco_py.cli:main"
puffco-py = "puffco_py.cli:main"

[project.urls]
Homepage = "https://github.com/SoyMilkIsOk/puffco-py"
Documentation = "https://github.com/SoyMilkIsOk/puffco-py#readme"
Repository = "https://github.com/SoyMilkIsOk/puffco-py.git"
"Bug Tracker" = "https://github.com/SoyMilkIsOk/puffco-py/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["puffco_py"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "puffco_py.cli"
ignore_errors = true


